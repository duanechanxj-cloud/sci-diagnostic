# Copy to .streamlit/secrets.toml for local testing ONLY.
# Never commit secrets.toml.
#
# Generate BOTH password hashes with:
#   python scripts/hash_password.py

[auth]
enabled = true

[auth.teacher]
display_name = "Teacher"
password_hash = "PASTE_TEACHER_HASH_HERE"

[auth.admin]
display_name = "Admin"
password_hash = "PASTE_ADMIN_HASH_HERE"

# Hosted mode: paste values generated by scripts/make_hosted_google_secrets.py.
# Do not keep real values in this example file.
[google_oauth]
client_id = ""
client_secret = ""
refresh_token = ""
token_uri = "https://oauth2.googleapis.com/token"

# For Mac-only development you can set enabled=false.
# For hosted use, enable this so mutable state is restored/saved to Google Drive.
[persistence]
enabled = false
backend = "google_drive"
# Admin selects the Google Drive project folder inside the Deployment page.
# The selected Drive folder is marked in Google Drive itself and rediscovered after restarts.
snapshot_name = "science_diagnostic_state.zip"
